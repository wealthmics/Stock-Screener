name: Build screener

# Three ways this runs:
#   1. push        - you upload a new All Stocks CSV into the data/ folder
#   2. workflow_dispatch - the "Run workflow" button on the Actions tab
#   3. schedule    - every weekday morning, so the Dataroma side stays fresh
on:
  push:
    paths:
      - 'data/**'
      - 'marquee_screener.py'
      - '.github/workflows/build-screener.yml'
  workflow_dispatch:
  schedule:
    # 02:30 UTC = 06:30 Gulf time, Monday to Friday
    - cron: '30 2 * * 1-5'

# lets the job commit index.html and the workbook back into the repo
permissions:
  contents: write

# a second run waits for the first instead of fighting over the branch
concurrency:
  group: build-screener
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pandas openpyxl selenium

      - name: Show what is in data/
        run: ls -la data/ || echo "data/ folder is missing"

      - name: Build the screener and the workbook
        run: |
          python marquee_screener.py \
            --data-dir data \
            --out-dir output \
            --publish-dir . \
            --scrape auto \
            --stable-names \
            --no-upload

      - name: Commit and push whatever changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html output data
          if git diff --quiet --cached; then
            echo "Nothing changed, no commit needed."
          else
            git commit -m "Screener rebuild $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Keep the built files as a download even if the commit is skipped
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-output
          path: |
            index.html
            output/*.xlsx
          retention-days: 14
          if-no-files-found: warn
