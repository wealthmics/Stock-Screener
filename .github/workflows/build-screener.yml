name: Build screener

# Two ways this runs:
#   1. schedule           - every night at 12:00 AM IST
#   2. workflow_dispatch  - the "Run workflow" button on the Actions tab
#
# The push trigger is deliberately absent, so uploading a new CSV does not start a build
# by itself. Upload whenever you like, then press Run workflow or wait for the nightly
# run. To bring the old behaviour back, add these three lines above schedule:
#   push:
#     paths:
#       - 'data/**'
on:
  schedule:
    # 18:30 UTC = 00:00 IST the next day. GitHub cron is always UTC.
    # Scheduled runs are best effort, so expect anywhere from midnight to about an hour
    # later when their queues are busy.
    - cron: '30 18 * * *'
  workflow_dispatch:

# lets the job commit index.html and the workbook back into the repo
permissions:
  contents: write

# a second run waits for the first instead of fighting over the branch
concurrency:
  group: build-screener
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # cache: pip is deliberately absent. It needs a requirements.txt or
          # pyproject.toml to exist before setup-python runs, and it fails the whole job
          # when neither is there. The install below is only three packages, so caching
          # saves a few seconds and is not worth a build that can break on layout.

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install --upgrade -r requirements.txt
          else
            echo "No requirements.txt in the repo, installing the defaults."
            pip install --upgrade pandas openpyxl selenium
          fi

      - name: Show what is in data/
        run: ls -la data/ || echo "data/ folder is missing"

      - name: Build the screener and the workbook
        run: |
          python marquee_screener.py \
            --data-dir data \
            --out-dir output \
            --publish-dir . \
            --scrape auto \
            --stable-names \
            --no-upload

      - name: Commit and push whatever changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html output data
          if git diff --quiet --cached; then
            echo "Nothing changed, no commit needed."
          else
            git commit -m "Screener rebuild $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Keep the built files as a download even if the commit is skipped
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-output
          path: |
            index.html
            output/*.xlsx
          retention-days: 14
          if-no-files-found: warn
